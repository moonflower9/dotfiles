keep-open=yes
load-unsafe-playlists=yes
ytdl-format=bestvideo[height<=1440]+bestaudio/best[height<=1440]

[youtube]
profile-desc="profile for YouTube videos"
profile-cond=get("path",""):find('youtu%.?be')
profile-restore=copy
deband=yes
volume=60
ytdl-raw-options="playlist-reverse=,sub-format=ass/all,cookies-from-browser=firefox,mark-watched="

[protocol.https]
cache=yes
cache-secs=9999
demuxer-max-bytes=2GiB
demuxer-max-back-bytes=1GiB

[protocol.http]
profile=protocol.https

